<style>
/* Layout: one 320x200 pixel stage scaled up crisp, thought bubbles over it. Single warm night-wood frame; the palette inside comes from the photos. */
:root{
  --frame:#2a2320; --panel:#f3dfae; --ink:#3a2412; --muted:#7d6450; --brown:#7a4420; --gold:#f6d98a;
  --display:"Pixelify Sans",ui-rounded,system-ui,sans-serif;
  --body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--frame);color:#f2e6cf;font-family:var(--body);font-size:20px}
.wrap{--u:3;--ar:1.6;width:min(100%,calc((100dvh - 150px) * var(--ar)));max-width:1600px;margin:0 auto;padding-block:12px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.wrap:fullscreen{width:min(100vw,calc(100vh * var(--ar)));padding-inline:16px;background:var(--frame);justify-content:center}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 16px;padding-inline:4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3vw,2.1rem);margin:0;color:var(--gold);text-shadow:2px 2px 0 #3b2010}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fs{font:600 .85rem var(--display);background:#5a3418;color:#ffe9b0;border:0;padding:.3em .8em;cursor:pointer;box-shadow:0 0 0 2px #2a1608,0 0 0 4px #b8783b;margin:0}

.where:empty{display:none}
.where{font-family:var(--display);font-size:.95rem;color:#ffe9b0;background:#5a3418;padding:.25em .8em;box-shadow:0 0 0 2px #2a1608,0 0 0 4px #b8783b;min-height:1.4em}
.stage{position:relative;width:100%;aspect-ratio:var(--ar);max-width:100%;background:#000;margin:6px 0;box-shadow:0 0 0 4px #5a3418,0 0 0 8px #b8783b,0 0 0 10px #2a1608,0 14px 40px rgba(0,0,0,.5)}

.bubble{position:absolute;left:50%;top:20%;transform:translate(0,-100%);max-width:min(80%,calc(var(--u) * 190px));min-width:calc(var(--u) * 40px);box-sizing:border-box;
  background:#fff8e6;color:var(--ink);font-size:max(calc(var(--u) * 6.2px),13px);line-height:1.05;padding:calc(var(--u) * 2.5px) calc(var(--u) * 3.5px) calc(var(--u) * 2.5px) calc(var(--u) * 2.5px);
  border:calc(var(--u) * 1px) solid #5a3418;clip-path:polygon(calc(var(--u) * 2px) 0,calc(100% - var(--u) * 2px) 0,100% calc(var(--u) * 2px),100% calc(100% - var(--u) * 2px),calc(100% - var(--u) * 2px) 100%,calc(var(--u) * 2px) 100%,0 calc(100% - var(--u) * 2px),0 calc(var(--u) * 2px));display:flex;gap:calc(var(--u) * 2.5px);align-items:center;pointer-events:none;text-wrap:pretty;z-index:2;
  margin-bottom:calc(var(--u) * 9px)}
.dots{position:absolute;left:50%;top:100%;width:0;height:0;pointer-events:none;z-index:2}
.dots i{position:absolute;background:#fff8e6;border:calc(var(--u) * 1px) solid #5a3418;box-sizing:border-box}
.dots i:nth-child(1){width:calc(var(--u) * 4px);height:calc(var(--u) * 3px);left:calc(var(--u) * -2px);top:calc(var(--u) * 1.5px)}
.dots i:nth-child(2){width:calc(var(--u) * 3px);height:calc(var(--u) * 2px);left:calc(var(--u) * 1px);top:calc(var(--u) * 5.5px)}
.bubble.below{margin-bottom:0;margin-top:calc(var(--u) * 9px)}
.bubble.below .dots{top:auto;bottom:100%}
.bubble.below .dots i:nth-child(1){top:auto;bottom:calc(var(--u) * 1.5px)}
.bubble.below .dots i:nth-child(2){top:auto;bottom:calc(var(--u) * 5.5px)}
.bubble img{width:max(calc(var(--u) * 15px),30px);height:max(calc(var(--u) * 14.3px),29px);image-rendering:pixelated;flex:0 0 auto;background:#efe4c8;border:calc(var(--u) * .7px) solid #c9a46a}

html.portrait .wrap{width:min(100%,calc((100dvh - 120px) * var(--ar)));padding-block:8px 12px;gap:6px}

html.touch .kb{display:none}
.wrap,.stage,.stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.stage textarea,.stage input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.pad{position:absolute;left:3%;bottom:3%;height:min(40%,140px);width:auto;aspect-ratio:1;display:none;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}

.pad b{display:block;background:rgba(243,223,174,.42);border:2px solid rgba(90,52,24,.6);box-sizing:border-box;position:relative}
.pad b:active,.pad b.on{background:rgba(217,147,63,.85)}

.pad b[data-k=u]{grid-area:1/2}.pad b[data-k=l]{grid-area:2/1}.pad b[data-k=r]{grid-area:2/3}.pad b[data-k=d]{grid-area:3/2}
.pad b[data-k=u]::after{border-bottom-color:#2a1608;margin-top:-4px}.pad b[data-k=d]::after{border-top-color:#2a1608;margin-top:4px}
.pad b[data-k=l]::after{border-right-color:#2a1608;margin-left:-4px}.pad b[data-k=r]::after{border-left-color:#2a1608;margin-left:4px}

.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(20,14,10,.6);overflow:auto;z-index:3}
.card.title{background:rgba(20,14,10,.18);align-items:flex-end;padding-bottom:6%}
.card-in{background:var(--panel);color:var(--ink);box-shadow:0 0 0 3px #b8783b,0 0 0 6px #5a3418,inset 0 0 0 2px #fff2cf;padding:20px 22px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.card.title{align-items:center;padding-bottom:0;cursor:pointer}
.card.title .card-in{max-width:min(92%,640px);padding:clamp(18px,4vw,40px) clamp(18px,5vw,48px);gap:clamp(8px,2vw,18px);background:rgba(243,223,174,.96)}
.card.title h2{font-size:clamp(1.8rem,min(9vw,calc(var(--u) * 24px)),5rem);letter-spacing:.02em;line-height:1}
.card.title p{font-size:clamp(1rem,min(3vw,calc(var(--u) * 8px)),1.7rem)}
.card.title .blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.card.title .blink{animation:none}}
.card h2{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4.5vw,2.1rem);margin:0;color:var(--brown);text-wrap:balance}
.card p{margin:0;font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.15;max-width:38ch;text-wrap:pretty}
.card .soft{color:var(--muted);font-size:1.05rem}
.outro{position:absolute;inset:0;background:#120e0c;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.outro .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4% 4% 14%;box-sizing:border-box;opacity:0;transition:opacity 1.1s ease}
.outro .ph.on{opacity:1}
.outro .ph video{max-width:100%;max-height:100%;object-fit:contain;border:calc(var(--u) * 1.2px) solid #f3dfae;box-shadow:0 0 0 calc(var(--u) * 1.2px) #5a3418,0 calc(var(--u) * 4px) calc(var(--u) * 10px) rgba(0,0,0,.6);background:#000}
.outro .ph img{max-width:100%;max-height:100%;object-fit:contain;border:calc(var(--u) * 1.2px) solid #f3dfae;box-shadow:0 0 0 calc(var(--u) * 1.2px) #5a3418,0 calc(var(--u) * 4px) calc(var(--u) * 10px) rgba(0,0,0,.6);background:#000}
.outro .cap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);max-width:88%;background:#fff8e6;color:var(--ink);font-size:max(calc(var(--u) * 7px),15px);line-height:1.05;padding:calc(var(--u) * 2.5px) calc(var(--u) * 4px);border:calc(var(--u) * 1px) solid #5a3418;clip-path:polygon(calc(var(--u) * 2px) 0,calc(100% - var(--u) * 2px) 0,100% calc(var(--u) * 2px),100% calc(100% - var(--u) * 2px),calc(100% - var(--u) * 2px) 100%,calc(var(--u) * 2px) 100%,0 calc(100% - var(--u) * 2px),0 calc(var(--u) * 2px));text-align:center;text-wrap:balance;opacity:0;transition:opacity .6s}
.outro .cap.on{opacity:1}
.outro .cap.empty{display:none}
.outro .fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u) * 4px);text-align:center;padding:6%;opacity:0;transition:opacity 1.2s;pointer-events:none}
.outro .fin.on{opacity:1;pointer-events:auto}
.outro .fin h2{font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(1.8rem,6vw,3.6rem);margin:0;text-shadow:2px 2px 0 #3b2010}
.outro .fin p{margin:0;color:#f2e6cf;font-size:clamp(.95rem,min(2.3vw,3.2vh),1.35rem);max-width:46ch;line-height:1.2}
html.short .outro .fin{padding:3% 6%;gap:4px}html.short .outro .fin h2{font-size:1.6rem}html.short .outro .fin p{font-size:.8rem;max-width:60ch;line-height:1.15}
.outro .fin p.sig{color:var(--gold);font-style:italic;margin-top:calc(var(--u) * 2px)}
.outro .fin{overflow:auto}
.outro .fin .count{color:#c9b28c;font-size:clamp(.85rem,min(1.9vw,2.8vh),1.1rem);margin-top:calc(var(--u) * 2px)}
.outro .mem{min-height:4.6em;max-width:46ch;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .9s ease}
.outro .mem.on{opacity:1}
.outro .mem q{color:#f2e6cf;font-style:italic;font-size:clamp(.9rem,min(2vw,3vh),1.2rem);line-height:1.25;quotes:"\201C" "\201D"}
.outro .mem span{display:block;color:var(--gold);font-size:.85em;margin-top:.35em}
.outro .mem small{display:block;color:#9a8a6e;font-size:.75em;margin-top:.2em}
.outro .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.outro .acts .ghost{background:transparent;color:var(--gold);box-shadow:0 0 0 2px #8a5a2a}
.outro .panel{position:absolute;inset:0;z-index:2;background:rgba(14,10,8,.94);display:flex;align-items:center;justify-content:center;padding:4%;cursor:default}
.outro .panel[hidden]{display:none}
.outro .sheet{background:var(--panel);color:var(--ink);box-shadow:0 0 0 3px #b8783b,0 0 0 6px #5a3418;padding:clamp(14px,3vw,24px);width:min(100%,520px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:left}
.outro .sheet h3{font-family:var(--display);margin:0;color:var(--brown);font-size:clamp(1.2rem,3vw,1.6rem)}
.outro .sheet p{margin:0;font-size:.95rem}
.outro .sheet textarea,.outro .sheet input{font:inherit;font-size:16px;padding:8px;border:2px solid #8a5a2a;background:#fffaf0;color:var(--ink);width:100%;box-sizing:border-box}

.outro .sheet .row{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.outro .sheet .left{text-align:left;margin-right:auto;font-size:.85rem;color:#7a5a3a}
.outro .sheet .err{color:#a8322a}
.outro .sheet .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.outro .list{display:flex;flex-direction:column;gap:14px}
.outro .list div{border-left:3px solid #c9963a;padding-left:10px}
.outro .list q{font-style:italic}.outro .list span{display:block;color:#7a5a3a;font-size:.85rem;margin-top:2px}
.card.title .plays{font-size:clamp(.85rem,min(2.2vw,calc(var(--u) * 6px)),1.15rem);color:#7a5a3a;margin-top:-4px}
.outro .skip{position:absolute;right:2%;top:2%;font:600 .8rem var(--display);background:rgba(90,52,24,.8);color:#ffe9b0;border:0;padding:.3em .8em;cursor:pointer;box-shadow:0 0 0 2px #2a1608;margin:0}
.debug{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 6px 0;font-family:var(--display);font-size:.8rem;color:#c9b28c}
.debug button{font:600 .75rem var(--display);background:#3b2a20;color:#ffe9b0;padding:.3em .7em;margin:0;box-shadow:0 0 0 2px #2a1608}
.debug button.cur{background:#8a5520}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:700 1rem var(--display);background:#d9933f;color:#2a1608;border:0;padding:.55em 1.4em;cursor:pointer;box-shadow:0 0 0 2px #2a1608,0 3px 0 2px #8a5520;margin-top:6px}

<body>
<div class="wrap">
  <header>
    <h1>Stella's Day</h1>
    <div class="right"><span class="where" id="where"></span><button class="fs" id="snd" type="button" aria-pressed="true">Sound: on</button><button class="fs" id="fs" type="button">Fullscreen</button></div>
  </header>
  <div class="stage">
    <canvas id="cv" aria-label="Stella's Day, a pixel-art game. Move Stella with arrow keys or by tapping."></canvas>
    <div class="card" id="card" hidden></div>
    <div class="pad" id="pad" aria-hidden="true"><b data-k="u"></b><b data-k="l"></b><b data-k="r"></b><b data-k="d"></b></div>
    <div class="bubble" id="bub" hidden><img id="face" alt=""><span id="say" aria-live="polite"></span><span class="dots"><i></i><i></i></span></div>
  </div>
  <p class="hint"><span class="kb">Arrow keys or WASD to move, or tap where you want her to go.</span><span class="tc" hidden>Tap where you want her to go, or use the pad.</span> Gold pawprints mark things to do; a green one means it's time to move on. There's no hurry.</p>
  <div class="debug" id="debug" hidden><span id="dbgcfg"></span><span>Jump to:</span></div>
</div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),sayEl=$('#say'),whereEl=$('#where'),cardEl=$('#card');
const W=320,H=200; // world size
let B=2,PXK=3; // B: canvas pixels per view unit (the canvas matches the screen's real pixels); PXK: canvas pixels per world pixel this frame (a whole number, so the art stays sharp)
let VW=W,VH=H; // on-screen view size in world units (portrait phones use a taller view)
const TOUCH=matchMedia('(pointer:coarse)').matches;if(TOUCH){document.documentElement.classList.add('touch');$('.tc').hidden=false;}
if(!document.fullscreenEnabled)$('#fs').hidden=true;
function layout(){const portrait=innerHeight>innerWidth*1.1&&innerWidth<1100;document.documentElement.classList.toggle('portrait',portrait);
  document.documentElement.classList.toggle('short',!portrait&&innerHeight<520);
  const nvw=portrait?180:W,nvh=portrait?240:H;VW=nvw;VH=nvh;wrap.style.setProperty('--ar',(VW/VH).toFixed(4));
  // draw at the screen's real pixel size so nothing gets stretched by the browser
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;let w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(w<VW||h<VH){w=VW*2;h=VH*2;}
  const changed=cv.width!==w||cv.height!==h;if(changed){cv.width=w;cv.height=h;}B=cv.width/VW;if(window.__ready&&changed)camSnap();}
addEventListener('resize',layout);
const bub=$('#bub'),wrap=$('.wrap'),stage=$('.stage');
new ResizeObserver(()=>{wrap.style.setProperty('--u',(stage.getBoundingClientRect().width/VW).toFixed(3));layout();}).observe(stage);
layout();
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else wrap.requestFullscreen().catch(()=>{});}catch(e){}};

/* ---------- pixel helpers ---------- */
let px=function(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function rr(x,y,w,h,f,o){if(o){px(x+1,y,w-2,1,o);px(x+1,y+h-1,w-2,1,o);px(x,y+1,1,h-2,o);px(x+w-1,y+1,1,h-2,o);}px(x+1,y+1,w-2,h-2,f);}
function nz(x,y){let n=(x*374761393+y*668265263)|0;n=((n^(n>>>13))*1274126177)|0;return ((n^(n>>>16))>>>0)%1000/1000;}
function txt(s,x,y,c,size,align){ctx.fillStyle=c;ctx.font=(size||10)+'px "VT323", monospace';ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,Math.round(x),Math.round(y));}
const GLYPH={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111',':':'000010000010000','/':'001001010100100','z':'000111010100111','t':'010111010010011','k':'100101110101101',' ':'000000000000000'};
function ptxt(str,x,y,c,sc,align){sc=sc||1;const w=str.length*4*sc-sc;let x0=align==='center'?x-Math.floor(w/2):align==='right'?x-w:x;
  for(const ch of str){const g=GLYPH[ch]||GLYPH[' '];for(let i=0;i<15;i++)if(g[i]==='1')px(x0+(i%3)*sc,y+Math.floor(i/3)*sc,sc,sc,c);x0+=4*sc;}}
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;}
function heart(x,y,c){px(x+1,y,1,1,c);px(x+3,y,1,1,c);px(x,y+1,5,1,c);px(x+1,y+2,3,1,c);px(x+2,y+3,1,1,c);}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- Stella (merle, tan points, white chest) ---------- */
const C={K:'#1b1a1f',D:'#2b2a33',M:'#3f3e4a',S:'#8b909d',L:'#c8cbd3',T:'#c98d4e',t:'#9a6430',W:'#f2ede3',P:'#e8899f'};

let OUTRO=null,OUTRO_ERR=null;
const outroReady=fetch('outro.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('outro.json could not be loaded (HTTP '+r.status+')');return r.text();})
  .then(t=>{try{OUTRO=JSON.parse(t);}catch(e){throw new Error('outro.json has a typo: '+e.message);}})
  .catch(e=>{OUTRO_ERR=e.message;console.error("Stella's Day: "+e.message);})
  .finally(()=>{const el=document.getElementById('dbgcfg');if(el)el.textContent=OUTRO_ERR?('⚠ '+OUTRO_ERR):('outro.json OK: '+(OUTRO.photos||[]).filter(p=>p&&!p.skip).length+' photos, showing '+OUTRO.howMany+' · ');});
const isVid=p=>/\.(mp4|webm|mov|m4v)$/i.test(p.file);
const mediaUrl=f=>/^(https?:)?\/\//.test(f)||f.includes('/')?f:'photos/'+f;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickShow(cfg){
  const all=(cfg.photos||[]).filter(p=>p&&p.file&&!p.skip);
  const chs=(cfg.chapters||[]).map(c=>typeof c==='string'?{name:c,share:1}:c).filter(c=>c&&c.name);
  for(const p of all){const n=p.chapter||'other';if(!chs.some(c=>c.name===n))chs.push({name:n,share:1});}
  let n=cfg.howMany==='all'?all.length:Math.max(0,Math.floor(+cfg.howMany||0));n=Math.min(n,all.length);
  const maxV=cfg.maxVideos==null?Infinity:Math.max(0,+cfg.maxVideos);
  const by={},picked={};let count=0,vids=0;
  for(const c of chs){by[c.name]=shuffle(all.filter(p=>(p.chapter||'other')===c.name));picked[c.name]=by[c.name].filter(p=>p.pin);count+=picked[c.name].length;vids+=picked[c.name].filter(isVid).length;}
  const tot=chs.reduce((a,c)=>a+Math.max(0,+c.share||0),0)||1;
  while(count<n){let best=null,bd=-Infinity,bp=null;
    for(const c of chs){const p=by[c.name].find(p=>!picked[c.name].includes(p)&&!(isVid(p)&&vids>=maxV));if(!p)continue;
      const d=n*Math.max(0,+c.share||0)/tot-picked[c.name].length+Math.random()*.9;if(d>bd){bd=d;best=c;bp=p;}}
    if(!best)break;picked[best.name].push(bp);count++;if(isVid(bp))vids++;}
  return chs.flatMap(c=>shuffle(picked[c.name]));}

  const set=(id,k)=>{const old=held.get(id);if(old===k)return;if(old)release(old);if(k){held.set(id,k);keys.add(k);pad.querySelector(`[data-k=${k}]`).classList.add('on');}};
  const release=k=>{keys.delete(k);pad.querySelector(`[data-k=${k}]`).classList.remove('on');};

  pad.addEventListener('pointermove',e=>{if(held.has(e.pointerId))set(e.pointerId,keyAt(e.clientX,e.clientY));});

/* ---------- loop ---------- */
function startIdle(){const pick=Math.random();
  if(pick<.3)anim('sit',rnd(2.5,4),null,true);
  else if(pick<.55)anim('yawn',2.2,null,true);
  else if(pick<.8)anim('scratch',2.4,null,true);
  else anim('shake',1.3,null,true);
  dog.nextIdle=rnd(6,11);}
function update(dt){
  if(OUTRO_MUSIC)musicTick();
  if(lineT>0){lineT-=dt;if(lineT<=0)nextLine();}
  MKA+=((thinking()||dog.anim?.3:1)-MKA)*Math.min(1,dt*5);
  if(paused)return;
  musicTick();
  timers=timers.filter(tm=>{tm.t-=dt;if(tm.t<=0){tm.fn();return false;}return true;});
  S.update&&S.update(dt);
  if(S===TITLE)return;
  camFollow(dt);
  if(dog.anim&&dog.anim.idle&&(keys.size||target)){dog.anim=null;dog.idle=0;}
  if(dog.anim){const a=dog.anim;a.t+=dt;if(a.t>=a.dur){dog.anim=null;a.then&&a.then();checkReady();}dog.moving=false;}
  else{
    let vx=0,vy=0;
    if(keys.size){target=null;if(keys.has('l'))vx--;if(keys.has('r'))vx++;if(keys.has('u'))vy--;if(keys.has('d'))vy++;}
    else if(target){const dx=target.x-dog.x,dy=target.y-dog.y,d=Math.hypot(dx,dy);if(d<2)target=null;else{vx=dx/d;vy=dy/d;}}
    const m=Math.hypot(vx,vy);dog.moving=m>0;
    if(m){const sp=72*(S.water&&dog.y<S.water?.6:1);dog.x+=vx/m*sp*dt;dog.y+=vy/m*sp*dt;if(Math.abs(vx)>.15)dog.face=vx>0?1:-1;
      const b=S.bounds;dog.x=Math.min(b[2],Math.max(b[0],dog.x));dog.y=Math.min(b[3],Math.max(b[1],dog.y));dog.idle=0;
      if(S.solid){for(const [sx,sy,sw,sh] of S.solid){if(dog.x>sx&&dog.x<sx+sw&&dog.y>sy&&dog.y<sy+sh){
        const ox=dog.x-vx/m*sp*dt,oy=dog.y-vy/m*sp*dt;if(!(ox>sx&&ox<sx+sw))dog.x=ox;else if(!(oy>sy&&oy<sy+sh))dog.y=oy;else{dog.x=ox;dog.y=oy;}if(target&&Math.hypot(target.x-dog.x,target.y-dog.y)<30)target=null;}}}}
    else if(!dog.special&&!S.leaving){dog.idle+=dt;if(dog.idle>dog.nextIdle){dog.idle=0;startIdle();}}
    // in and out of the water
    const inW=!!(S.water&&dog.y<S.water);
    if(inW&&!dog.wasInWater)sfx('splash');
    if(!inW&&dog.wasInWater&&!dog.anim){anim('shake',1.4);sfx('shake');}
    dog.wasInWater=inW;
    for(const h of S.spots){if(h.done||(h.when&&!h.when()))continue;const p=h.pos?h.pos():h,near=Math.hypot(dog.x-p.x,dog.y-p.y)<h.r;
      if(h.rearm){if(!near)h.rearm=false;continue;}
      if(near&&!thinking()){h.done=true;target=null;h.act();checkReady();break;}}
    if(!dog.anim&&!thinking()&&S.exit&&ready()&&!S.leaving&&Math.hypot(dog.x-S.exit.x,dog.y-S.exit.y)<S.exit.r){S.leaving=true;target=null;S.exit.act();}
  }
}
const MK={
 paw:{p:{h:'#fff4c4',f:'#f6d98a',s:'#c99a3c'},g:["..hf.hf..","..fs.fs..","hf.....hf","fs.hff.fs","..hffff..",".hfffffs.",".ffffsss.","..fs.ss.."]},
};
for(const k in MK){const g=MK[k].g,w=Math.max(...g.map(r=>r.length)),h=g.length,G=g.map(r=>r.padEnd(w,'.').replace(/ /g,'.'));
  const pts=[],ol=new Set();for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=G[y][x];if(c==='.')continue;pts.push([x,y,c]);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h||G[Y][X]==='.')ol.add(X+','+Y);}}
  MK[k].pts=pts;MK[k].ol=[...ol].map(v=>v.split(',').map(Number));MK[k].w=w;MK[k].h=h;}
const MKX={o:'#10241a',h:'#efffef',f:'#74e89f',s:'#2a9c5a',w:'#efffef'};
function markerRing(x,y,strong){const k=(time*.9+(x*7+y*3)%10/10)%1,rx=3+k*8,ry=rx*.4,a=(1-k).toFixed(2);
  const c=strong?`rgba(116,232,159,${a})`:`rgba(255,210,63,${a})`,d=`rgba(43,26,14,${(a*.6).toFixed(2)})`;
  for(let i=0;i<20;i++){const t=i/20*6.283,qx=Math.round(x+Math.cos(t)*rx),qy=Math.round(y+Math.sin(t)*ry);px(qx,qy+1,1,1,d);px(qx,qy,1,1,c);}}
function marker(x,y,strong){const M=MK.paw,P=strong?MKX:M.p,o=strong?MKX.o:'#2b1a0e',bob=Math.round(Math.sin(time*5)*1.6),
  x0=Math.round(x)-(M.w>>1),y0=Math.round(y)-14-M.h+bob;
  for(const [a,b] of M.ol)px(x0+a,y0+b,1,1,o);for(const [a,b,c] of M.pts)px(x0+a,y0+b,1,1,P[c]||P.f);

  rr(X-34,3,31,12,'#15161c','#2b2c36');

function draw(){
  if(!S)return;

  const Z=view(),K=Z.k;PXK=K;PARX=S.zoomOut?(()=>{const vw=cv.width/kIn();return vw>=W?0:Math.min(W-vw,Math.max(0,dog.x-vw/2));})():Z.x;

  if(sp&&sp.pose){pose=sp.pose;if(sp.tuck)o.tuck=true;}
  else if(ty==='nap')pose='sleep';
  else if(ty==='sit'||ty==='sitlook')pose='sit';

  else if(ty==='roll'){pose=(k<.15||k>.85)?'lie':'belly';o.wig=Math.floor(time*8)%2;
    if(pose!==a.lastPose){if(a.lastPose)sfx('flop');a.lastPose=pose;}else if(pose==='belly'&&o.wig!==a.lastWig)sfx('wiggle');a.lastWig=o.wig;}
  else if(ty==='bounce'){o.frame=null;o.wag=true;o.wagSpeed=14;}
  else if(ty==='wag'){o.frame=null;o.wag=true;o.wagSpeed=12;o.tongue=true;}
  else if(ty==='zoom'){o.frame=Math.floor(time*10)%4;o.tongue=true;o.wag=true;o.wagSpeed=14;}
  else if(ty==='tap'){o.frame=Math.floor(time*16)%4;sfx('tap',.125);}
  else if(ty==='drink'){o.sniff=true;o.frame=null;o.wag=true;o.wagSpeed=3;sfx('lap',.2);}
  else if(ty==='dig'){o.frame=Math.floor(time*18)%2?1:3;o.sniff=true;sfx('dig',.22);}
  if(pose==='stand'&&!o.wag&&!o.tuck&&nearPeople()){o.wag=true;o.wagSpeed=dog.moving?12:7;}

  if(dog.carry)o.tongue=false;
  const fx=Math.round((sp?sp.x:dog.x)*K)/K-x0,fy=Math.round((sp?sp.y:dog.y)*K)/K-y0;ctx.save();ctx.translate(fx,fy);
  ctx.save();if(inWater){ctx.beginPath();ctx.rect(0,0,W,y-7);ctx.clip();}

  else{
    if(ty==='shake'){for(let i=0;i<10;i++){const ang=i/10*6.283,r=6+((time*40+i*7)%12);px(x+Math.cos(ang)*r,y-10+Math.sin(ang)*r*.6,1,1,dog.wet?'#9fd0f0':'#e6d7a8');}}
    else if(dog.wet)for(let i=0;i<4;i++){const kk=(time*1.3+i*.25)%1;px(x-9+i*6,y-14+kk*12,1,1,`rgba(140,200,240,${1-kk})`);}

}
